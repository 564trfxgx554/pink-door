server:
  port: 8080

spring:
  application:
    name: pink-door-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pink_door}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # schema.sql 只使用 CREATE TABLE IF NOT EXISTS，每次启动执行都是安全的。
      mode: always
      schema-locations: classpath:db/schema.sql
      # 题库数据使用 INSERT ... WHERE NOT EXISTS，重复启动不会重复插入。
      data-locations: classpath:db/quiz-data.sql
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    async:
      # AI 流式回答可能持续较久，给异步请求留足时间。
      request-timeout: 120s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段把 SQL 打印到控制台，生产环境请移除。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

pink-door:
  jwt:
    # Base64 编码的 HMAC-SHA256 密钥（解码后至少 32 字节），可用 JWT_SECRET 环境变量覆盖。
    secret: ${JWT_SECRET:LDjnhcwGFV/ysZa4mUQiIT1LPoD1E2cfXQAatF2b988=}
    expire-hours: 24
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      # 线上前端的访问域名（帽子云每次部署的子域名是快照，访问域名才是最新版）。
      - https://pinkdoor-10h3c3o2.maozi.io
      - https://qrlvmfwjm-pinkdoor-10h3c3o2.maozi.io
  preset-accounts:
    # 同一个 couple-name 的账号属于同一个情侣空间。
    # 首次启动自动创建，之后每次启动同步密码和空间，改完重启即可生效。
    - nickname: dyt
      password: ${PRESET_PASSWORD:dyt666}
      couple-name: 我们的小屋
    # 第二个账号：把 nickname 和 HER_PASSWORD 改成她的昵称和暗号后再启动。
    - nickname: scx
      password: ${HER_PASSWORD:scx666}
      couple-name: 我们的小屋
  ai:
    # Python AI 服务地址，仅内网访问。
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    # Java 调用 Python 的内部令牌，必须与 pink-door-ai/.env 的 AI_INTERNAL_TOKEN 一致。
    internal-token: ${AI_INTERNAL_TOKEN:change-me}
    timeout-seconds: 120

logging:
  level:
    com.pinkdoor: debug
